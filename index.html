<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>Menú Cafetería</title>

<style>

body{
  margin:0;
  padding:15px;
  background:#ffffff;
  font-family:Arial,sans-serif;
}

table{
  width:100%;
  border-collapse:collapse;
}

td{
  border:2px solid #000;
}

.logo{
  width:120px;
  text-align:center;
  font-weight:bold;
}

.titulo{
  background:#d9d9d9;
  font-size:28px;
  font-weight:bold;
  padding:6px;
}

.temporada{
  background:#d9d9d9;
  font-size:22px;
  font-weight:bold;
}

.cabecera{
  background:#f0c565;
  font-size:22px;
  font-weight:bold;
  text-align:center;
}

.dia{
  background:#d8d8d8;
  width:220px;
  text-align:center;
  font-style:italic;
  font-weight:bold;
  padding:10px;
}

.fecha{
  font-size:26px;
  font-weight:bold;
  margin:15px 0;
}

.numero{
  background:#f0c565;
  width:60px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
}

.menu{
  text-align:center;
  vertical-align:top;
  padding:8px;
}

.item{
  margin:6px 0;
  font-size:20px;
  font-weight:bold;
}

.vegano{
  background:#d8f0c2;
  font-weight:bold;
  text-align:center;
}

.postre{
  background:#c7d7a2;
  text-align:center;
  font-weight:bold;
}

</style>

</head>

<body>

<table>

<tr>

<td rowspan="2" class="logo">
SJD
</td>

<td colspan="2" class="titulo">
MENÚ SETMANA
</td>

<td class="temporada" id="tituloDia">
CARGANDO...
</td>

</tr>

<tr>

<td colspan="2" class="cabecera">
DINAR / COMIDA
</td>

<td class="cabecera">
SOPAR / CENA
</td>

</tr>

<tr>

<td rowspan="5" class="dia" id="dia">
CARGANDO...
</td>

<td class="numero">1</td>

<td class="menu" id="cp"></td>

<td class="menu" id="cnp"></td>

</tr>

<tr>

<td class="numero">2</td>

<td class="menu" id="cs"></td>

<td class="menu" id="cns"></td>

</tr>

<tr>

<td class="numero">V</td>

<td class="vegano" id="cveg"></td>

<td class="vegano" id="cnveg"></td>

</tr>

<tr>

<td class="numero">P</td>

<td class="postre" id="cpostre"></td>

<td class="postre" id="cnpostre"></td>

</tr>

</table>

<script>

const URL_JSON =
"https://script.google.com/macros/s/AKfycbxi7zYor8bUyAno5CUTJXWBin_ySMJDPrm9-Y1iY5pqKzOZwzwSXUsmtL8wwdPwPPqmqQ/exec";

const CAT = {
"Lunes":"DILLUNS",
"Martes":"DIMARTS",
"Miércoles":"DIMECRES",
"Jueves":"DIJOUS",
"Viernes":"DIVENDRES",
"Sábado":"DISSABTE",
"Domingo":"DIUMENGE"
};

async function cargar(){

try{

const respuesta =
await fetch(URL_JSON + "?t=" + Date.now());

const datos =
await respuesta.json();

const fechaActual = new Date();

const fechaTexto =
String(fechaActual.getDate()).padStart(2,"0") + "/" +
String(fechaActual.getMonth()+1).padStart(2,"0") + "/" +
fechaActual.getFullYear();

const filasHoy =
datos.filter(x =>
String(x.Fecha).trim() === fechaTexto &&
String(x.Activo).trim().toUpperCase() === "SI"
);

if(filasHoy.length === 0){

document.getElementById("tituloDia").innerHTML =
"SIN MENÚ";

return;

}

const hoy = filasHoy[0].Dia;

document.getElementById("tituloDia").innerHTML =
fechaTexto;

document.getElementById("dia").innerHTML =
CAT[hoy] +
"<div class='fecha'>" +
fechaTexto +
"</div>" +
hoy.toUpperCase();

function filtrar(servicio,categoria){

return filasHoy.filter(x =>
x.Servicio === servicio &&
x.Categoria === categoria
);

}

function pintar(lista){

return lista.map(x =>
"<div class='item'>" +
x.Plato_Cat +
"</div>"
).join("");

}

document.getElementById("cp").innerHTML =
pintar(filtrar("Comida","Primero"));

document.getElementById("cnp").innerHTML =
pintar(filtrar("Cena","Primero"));

document.getElementById("cs").innerHTML =
pintar(filtrar("Comida","Segundo"));

document.getElementById("cns").innerHTML =
pintar(filtrar("Cena","Segundo"));

document.getElementById("cveg").innerHTML =
pintar(filtrar("Comida","Vegano"));

document.getElementById("cnveg").innerHTML =
pintar(filtrar("Cena","Vegano"));

document.getElementById("cpostre").innerHTML =
pintar(filtrar("Comida","Postre"));

document.getElementById("cnpostre").innerHTML =
pintar(filtrar("Cena","Postre"));

}
catch(e){

document.getElementById("tituloDia").innerHTML =
"ERROR";

}

}

cargar();

setInterval(cargar,60000);

</script>

</body>
</html>
