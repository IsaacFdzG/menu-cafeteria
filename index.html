<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Menú Cafetería</title>

<style>

body{
  margin:0;
  padding:10px;
  background:#ffffff;
  font-family:Arial,sans-serif;
}

table{
  width:100%;
  border-collapse:collapse;
}

td{
  border:2px solid #000;
}

.logo{
  width:130px;
  text-align:center;
  font-weight:bold;
  font-size:22px;
}

.titulo{
  background:#d9d9d9;
  font-size:34px;
  font-weight:bold;
  padding:8px;
}

.temporada{
  background:#d9d9d9;
  font-size:28px;
  font-weight:bold;
  text-align:center;
}

.cabecera{
  background:#e8c15b;
  font-size:24px;
  font-weight:bold;
  text-align:center;
}

.dia{
  background:#d8d8d8;
  width:220px;
  text-align:center;
  font-weight:bold;
  font-style:italic;
}

.fechaCompleta{
  font-size:30px;
  font-weight:bold;
  margin:15px 0;
}

.numero{
  background:#e8c15b;
  width:120px;
  text-align:center;
  font-size:15px;
  font-weight:bold;
  line-height:1.2;
  padding:12px 5px;
}

.menu{
  text-align:center;
  vertical-align:top;
  padding:10px;
}

.item{
  margin:10px 0;
  font-size:22px;
  font-weight:bold;
}

.veg{
  background:#d8edc6;
}

.postre{
  background:#c7d7a2;
}

</style>

</head>

<body>

<table>

<tr>

<td rowspan="2" class="logo">
SJD
</td>

<td colspan="2" class="titulo" id="tituloSemana">
MENÚ SETMANA
</td>

<td class="temporada">
ESTIU 2026
</td>

</tr>

<tr>

<td colspan="2" class="cabecera">
DINAR / COMIDA
</td>

<td class="cabecera">
SOPAR / CENA
</td>

</tr>

<tr>

<td rowspan="5" class="dia" id="dia">
CARGANDO...
</td>

<td class="numero">
PRIMERO
</td>

<td class="menu" id="cp"></td>

<td class="menu" id="cnp"></td>

</tr>

<tr>

<td class="numero">
SEGUNDO
</td>

<td class="menu" id="cs"></td>

<td class="menu" id="cns"></td>

</tr>

<tr>

<td class="numero veg">
VEGANO
</td>

<td class="menu veg" id="cveg"></td>

<td class="menu veg" id="cnveg"></td>

</tr>

<tr>

<td class="numero postre">
POSTRE
</td>

<td class="menu postre" id="cpostre"></td>

<td class="menu postre" id="cnpostre"></td>

</tr>

</table>

<script>

const URL_JSON =
"https://script.google.com/macros/s/AKfycbxi7zYor8bUyAno5CUTJXWBin_ySMJDPrm9-Y1iY5pqKzOZwzwSXUsmtL8wwdPwPPqmqQ/exec";

const CAT = {
"Lunes":"DILLUNS",
"Martes":"DIMARTS",
"Miércoles":"DIMECRES",
"Jueves":"DIJOUS",
"Viernes":"DIVENDRES",
"Sabado":"DISSABTE",
"Sábado":"DISSABTE",
"Domingo":"DIUMENGE"
};

function semanaMes(fecha){
  return Math.ceil(fecha.getDate()/7);
}

async function cargar(){

try{

const respuesta =
await fetch(URL_JSON + "?t=" + Date.now());

const datos =
await respuesta.json();

const hoy = new Date();

const yyyy = hoy.getFullYear();

const mm =
String(hoy.getMonth()+1).padStart(2,"0");

const dd =
String(hoy.getDate()).padStart(2,"0");

const fechaISO =
`${yyyy}-${mm}-${dd}`;

const registrosHoy =
datos.filter(x =>
String(x.Fecha).startsWith(fechaISO)
);

if(registrosHoy.length===0){

document.getElementById("dia").innerHTML =
"SIN MENÚ";

return;

}

const diaES =
registrosHoy[0].Dia;

const fechaVisible =
`${dd}/${mm}/${yyyy}`;

document.getElementById("tituloSemana").innerHTML =
"MENÚ SETMANA " + semanaMes(hoy);

document.getElementById("dia").innerHTML =
(CAT[diaES] || diaES.toUpperCase()) +
"<div class='fechaCompleta'>" +
fechaVisible +
"</div>" +
diaES.toUpperCase();

function filtrar(servicio,categoria){

return registrosHoy.filter(x =>
x.Servicio===servicio &&
x.Categoria===categoria &&
x.Activo==="SI"
);

}

function pintar(lista){

return lista.map(x =>
`<div class="item">${x.Plato_Cat}</div>`
).join("");

}

document.getElementById("cp").innerHTML =
pintar(filtrar("Comida","Primero"));

document.getElementById("cnp").innerHTML =
pintar(filtrar("Cena","Primero"));

document.getElementById("cs").innerHTML =
pintar(filtrar("Comida","Segundo"));

document.getElementById("cns").innerHTML =
pintar(filtrar("Cena","Segundo"));

document.getElementById("cveg").innerHTML =
pintar(filtrar("Comida","Vegano"));

document.getElementById("cnveg").innerHTML =
pintar(filtrar("Cena","Vegano"));

document.getElementById("cpostre").innerHTML =
pintar(filtrar("Comida","Postre"));

document.getElementById("cnpostre").innerHTML =
pintar(filtrar("Cena","Postre"));

}
catch(error){

document.getElementById("dia").innerHTML =
"ERROR";

console.error(error);

}

}

cargar();

setInterval(cargar,60000);

</script>

</body>
</html>
